interface:
  display_name: "Lecture to Notes (Markdown)"
  short_description: "视频/文字稿/课件 → 中文 Markdown 课堂笔记（Markdown 平行版，不依赖 LaTeX）。默认 ASR 已在 macOS Apple Silicon + Linux ARM64 + Windows 端到端跑通。"
  default_prompt: "Use $lecture-to-md to turn a lecture video (local file or Bilibili/YouTube URL), transcript, and/or slide deck into detailed Chinese Markdown notes. Auto-detects the platform, extracts 5s-spaced frames, selects figures per ### heading with slide screenshots prioritized over video frames, verifies transcripts against official subtitles or the bundled $local-asr backend, and outputs notes.md with relative-path images. The local ASR backend reuses the upstream scripts/transcribe_x_asr.py when the skill is bundled in the same repo (provides 30s chunking and timestamp stitching); for very long lectures or stand-alone installs see the SKILL.md notes. macOS Apple Silicon + Linux ARM64 + Windows have been verified end-to-end."
