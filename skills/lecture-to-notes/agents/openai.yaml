interface:
  display_name: "Lecture to Notes"
  short_description: "Turn YouTube/Bilibili/X(Twitter) lectures into Chinese LaTeX/PDF notes."
  default_prompt: "Use this skill when a user provides a YouTube, Bilibili, or X/Twitter lecture URL. Select full-frame teaching figures through contact-sheet review, fall back to Whisper when captions are unavailable or rejected, and produce high-information-density Chinese LaTeX notes with a compiled PDF."
